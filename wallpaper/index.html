<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi HUD</title>
<!--
  Lumi - animated desktop for the salon (Lively Wallpaper).
  Data from Lumi at http://127.0.0.1:5055 (state, salon today, weather).
  Lively: Settings -> Wallpaper -> Wallpaper input: Mouse.
-->
<style>
  :root {
    --bg: #0d100a; --bg2: #161b11; --card: rgba(30, 38, 24, .60); --card-hi: rgba(42, 52, 32, .74);
    --line: rgba(201, 192, 143, .16); --line-hi: rgba(201, 192, 143, .40);
    --rose: #c9c08f; --gold: #c8a75a; --cream: #eef0e2; --text: #c5c9b4; --dim: #7f8770;
    --sage: #9fbf86; --red: #ff8a8a; --amber: #f2c27b;
    --serif: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
    --sans: "Segoe UI Variable Text", "Segoe UI", "Inter", system-ui, sans-serif;
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); user-select: none; }
  canvas#bg { position: fixed; inset: 0; z-index: 0; }
  .app { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-columns: minmax(310px, 24vw) 1fr minmax(330px, 25vw);
         gap: 2vw; padding: 3.4vh 2.4vw 3.4vh; }
  .col { display: flex; flex-direction: column; gap: 1.8vh; min-height: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 2vh 1.3vw;
          backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); }
  .eyebrow { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--dim); margin: 0 0 1.2vh; display: flex; align-items: center; gap: 10px; }
  .eyebrow::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-hi), transparent); }
  .eyebrow .act { order: 3; color: var(--rose); letter-spacing: .1em; text-transform: none; cursor: pointer; }

  .salon { font-family: var(--serif); font-size: clamp(24px, 1.9vw, 38px); color: var(--cream); font-weight: 500; letter-spacing: .02em; line-height: 1.1; }
  .clock { font-family: var(--serif); font-size: clamp(56px, 5.6vw, 110px); color: var(--cream); font-weight: 300; line-height: 1; margin-top: 1vh; font-variant-numeric: lining-nums; }
  .date { color: var(--dim); font-size: clamp(13px, .9vw, 16px); margin-top: .4vh; }
  .wx { margin-top: 1.4vh; font-size: 13px; color: var(--text); }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi { text-align: left; }
  .kpi .n { font-family: var(--serif); font-size: clamp(28px, 2.2vw, 42px); color: var(--cream); line-height: 1; }
  .kpi .l { font-size: 11px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }

  .next .when { font-family: var(--serif); font-size: clamp(34px, 2.6vw, 50px); color: var(--rose); line-height: 1; }
  .next .who { font-size: clamp(18px, 1.3vw, 24px); color: var(--cream); margin-top: .8vh; }
  .next .what { color: var(--text); font-size: 14px; margin-top: .4vh; }
  .warn { margin-top: 1vh; padding: 8px 10px; border-radius: 10px; background: rgba(255, 138, 138, .12); border: 1px solid rgba(255, 138, 138, .35);
          color: #ffd0d0; font-size: 13px; }
  .empty { color: var(--dim); font-size: 13.5px; }

  /* centre */
  .centre { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh; min-width: 0; }
  .orb { position: relative; width: min(36vh, 27vw); aspect-ratio: 1; cursor: pointer; }
  .orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .orb .nm { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--serif); font-size: min(8vh, 6vw); color: var(--cream);
             letter-spacing: .06em; text-shadow: 0 0 30px rgba(201, 192, 143, .55); pointer-events: none; }
  .state { font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: var(--rose); }
  .hint { font-size: clamp(14px, 1vw, 18px); color: var(--text); min-height: 1.3em; }
  .bubble { max-width: min(44vw, 740px); text-align: center; font-family: var(--serif); font-size: clamp(18px, 1.35vw, 26px); line-height: 1.4; color: var(--cream); min-height: 3em; }
  .bubble small { display: block; font-family: var(--sans); font-size: 11px; letter-spacing: .22em; color: var(--dim); text-transform: uppercase; margin-bottom: 6px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 46vw; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--card); color: var(--cream); font-family: var(--sans); font-size: 14px; cursor: pointer; backdrop-filter: blur(12px); }
  .pill:hover { border-color: var(--rose); background: var(--card-hi); }
  .pill svg { width: 17px; height: 17px; stroke: var(--rose); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .pill.muted { border-color: rgba(255, 138, 138, .55); }
  .pill.muted svg { stroke: var(--red); }

  /* timeline */
  .grow { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .timeline { overflow-y: auto; scrollbar-width: none; flex: 1; min-height: 0; position: relative; }
  .timeline::-webkit-scrollbar { display: none; }
  .slot { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
  .slot:last-child { border-bottom: 0; }
  .slot .t { font-family: var(--serif); font-size: 20px; color: var(--cream); }
  .slot .b { border-left: 3px solid var(--rose); padding-left: 10px; min-width: 0; }
  .slot .c { color: var(--cream); font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot .s { color: var(--dim); font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot.done { opacity: .45; }
  .slot.done .c::after { content: " ✓"; color: var(--sage); }
  .slot.now { background: linear-gradient(90deg, rgba(201, 192, 143, .12), transparent); border-radius: 10px; }
  .slot .al { color: var(--red); }
  .alerts .row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 13.5px; color: var(--cream); border-bottom: 1px solid var(--line); }
  .alerts .row:last-child { border-bottom: 0; }
  .alerts .row b { color: var(--amber); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; min-width: 70px; }
  .alerts .row.bd b { color: var(--rose); }
  .sys { font-size: 11px; color: var(--dim); text-align: right; letter-spacing: .06em; }
  .toast { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--card-hi);
           border: 1px solid var(--line-hi); color: var(--cream); font-size: 14px; opacity: 0; transition: opacity .25s; z-index: 5; }
  .toast.show { opacity: 1; }
  /* panels (Huecos, Caja, Stock) */
  .veil { position: fixed; inset: 0; z-index: 8; background: rgba(6, 8, 4, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
          display: none; align-items: center; justify-content: center; }
  .veil.show { display: flex; }
  .panel { width: min(760px, 88vw); max-height: 82vh; display: flex; flex-direction: column; background: rgba(22, 28, 17, .94);
           border: 1px solid var(--line-hi); border-radius: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); overflow: hidden; }
  .panel.frame { width: min(1180px, 92vw); height: min(860px, 88vh); max-height: none; }
  .panel.frame iframe { border: 0; width: 100%; height: 100%; background: #151b10; }
  .panel header { display: flex; align-items: center; gap: 14px; padding: 22px 26px 14px; border-bottom: 1px solid var(--line); }
  .panel h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 30px; color: var(--cream); flex: 1; }
  .panel .x { background: none; border: 1px solid var(--line); color: var(--cream); width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .panel .x:hover { border-color: var(--rose); }
  .panel .body { padding: 18px 26px 22px; overflow-y: auto; }
  .panel .foot { padding: 12px 26px 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); }
  .panel h3 { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: 18px 0 10px; }
  .panel h3:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--cream); font-size: 15px;
          font-variant-numeric: tabular-nums; }
  .chip small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
  .stat .n { font-family: var(--serif); font-size: 30px; color: var(--cream); line-height: 1.1; }
  .stat .l { font-size: 11px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; margin-top: 4px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t td, table.t th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; color: var(--cream); }
  table.t th { color: var(--dim); font-weight: 500; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; }
  table.t tr.low td { color: #ffd0d0; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(255, 138, 138, .45); color: #ffb3b3; margin-left: 6px; }
  /* folder: Mis archivos */
  .folder { cursor: pointer; transition: border-color .25s, background .25s, box-shadow .25s; }
  .folder:hover, .folder:focus-visible { border-color: var(--line-hi); background: var(--card-hi); outline: none; }
  .folder.over { border-color: var(--rose); background: var(--card-hi); box-shadow: 0 0 0 1px var(--rose), 0 0 34px rgba(201,192,143,.18); }
  .folder .fh { display: flex; align-items: center; gap: 14px; }
  .folder .fi { width: 50px; height: 50px; flex: none; transition: transform .25s; }
  .folder:hover .fi, .folder.over .fi { transform: translateY(-2px); }
  .folder .fi svg { width: 100%; height: 100%; fill: none; stroke: var(--rose); stroke-width: 1.3; stroke-linejoin: round; }
  .folder .ft { font-family: var(--serif); font-size: clamp(20px, 1.5vw, 26px); color: var(--cream); line-height: 1.1; }
  .folder .fs { font-size: 12.5px; color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder .thumbs { display: flex; gap: 8px; margin-top: 1.3vh; }
  .folder .thumbs:empty { display: none; }
  .folder .tb { position: relative; width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.22); overflow: hidden;
                display: grid; place-items: center; flex: none; }
  .folder .tb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .folder .tb svg { width: 20px; height: 20px; fill: none; stroke: var(--rose); stroke-width: 1.5; }
  .folder .tb.more { font-size: 12px; color: var(--dim); }
  .fveil { position: fixed; inset: 0; z-index: 9; background: rgba(6, 8, 4, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
           display: none; align-items: center; justify-content: center; }
  .fveil.show { display: flex; }
  .fpanel { width: min(980px, 90vw); height: min(760px, 84vh); display: flex; flex-direction: column; background: rgba(22, 28, 17, .96);
            border: 1px solid var(--line-hi); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden; position: relative; }
  .fpanel header { display: flex; align-items: center; gap: 10px; padding: 20px 24px 14px; border-bottom: 1px solid var(--line); }
  .fpanel h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 30px; color: var(--cream); flex: 1; }
  .fpanel .x { background: none; border: 1px solid var(--line); color: var(--cream); width: 36px; height: 36px; border-radius: 50%; font-size: 17px; cursor: pointer; }
  .fbody { flex: 1; overflow-y: auto; padding: 18px 24px 24px; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; display: flex; flex-direction: column; }
  .tile { transition: border-color .2s; } .tile:hover { border-color: var(--line-hi); }
  .tile .th { height: 110px; display: grid; place-items: center; background: rgba(0,0,0,.22); position: relative; }
  .tile .th { flex: none; overflow: hidden; }
  .tile .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .th svg { width: 40px; height: 40px; fill: none; stroke: var(--rose); stroke-width: 1.4; }
  .tile .th .ext { position: absolute; bottom: 14px; font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--rose); }
  .tile .nm { padding: 8px 10px 2px; font-size: 13px; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .mt { padding: 0 10px 6px; font-size: 11px; color: var(--dim); }
  .tile .ta { display: flex; gap: 4px; padding: 0 8px 8px; }
  .tile .ta button { flex: 1; padding: 5px 0; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.2); color: var(--cream); font-size: 11.5px; cursor: pointer; }
  .tile .ta button:hover { border-color: var(--rose); }
  .tile .ta button.arm { background: var(--red); color: #2a0d0d; border-color: var(--red); }
  .drop { position: absolute; inset: 0; display: none; place-items: center; background: rgba(201,192,143,.12); border: 2px dashed var(--rose);
          border-radius: 22px; font-family: var(--serif); font-size: 30px; color: var(--cream); pointer-events: none; }
  .fpanel.over .drop { display: grid; }
  .fempty { text-align: center; color: var(--dim); padding: 8vh 0; font-size: 15px; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="app">
  <div class="col">
    <section class="card">
      <div class="salon" id="salon">Lumi</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="wx" id="wx"></div>
    </section>
    <section class="card">
      <div class="eyebrow">Hoy</div>
      <div class="kpis">
        <div class="kpi"><div class="n" id="k-apps">–</div><div class="l">Citas</div></div>
        <div class="kpi"><div class="n" id="k-left">–</div><div class="l">Pendientes</div></div>
        <div class="kpi" data-panel="cash" style="cursor:pointer"><div class="n" id="k-cash">–</div><div class="l">Caja</div></div>
      </div>
    </section>
    <section class="card folder" id="folder" role="button" tabindex="0" aria-label="Mis archivos: abrir la carpeta">
      <div class="eyebrow">Mis archivos <span class="act" id="f-quick">Subir</span></div>
      <div class="fh">
        <div class="fi"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c9c08f" stop-opacity=".34"/><stop offset="1" stop-color="#c8a75a" stop-opacity=".10"/></linearGradient></defs>
          <path d="M5 13a3 3 0 0 1 3-3h10.5l4 4.5H40a3 3 0 0 1 3 3V36a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="url(#fg)"/>
          <path d="M5 19.5h38"/></svg></div>
        <div style="min-width:0;flex:1"><div class="ft" id="f-title">Carpeta vacía</div><div class="fs" id="f-count">Arrastre aquí fotos, PDF o documentos</div></div>
      </div>
      <div class="thumbs" id="f-recent"></div>
    </section>
    <section class="card next" id="next-card">
      <div class="eyebrow">Próximo cliente</div>
      <div id="next"><div class="empty">Sin más citas hoy</div></div>
    </section>
  </div>

  <div class="centre">
    <div class="orb" id="orb" title="Silenciar / activar micro"><canvas id="orbc"></canvas><div class="nm">Lumi</div></div>
    <div class="state" id="state">OFFLINE</div>
    <div class="hint" id="hint"></div>
    <div class="bubble" id="bubble"></div>
    <div class="actions">
      <button class="pill" id="mic" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Micro</button>
      <button class="pill" data-panel="slots" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Huecos</button>
      <button class="pill" data-panel="cash" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Caja</button>
      <button class="pill" data-panel="recipes" type="button"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7M8 11h5"/></svg>Recetas</button>
      <button class="pill" data-panel="stock" type="button"><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>Stock</button>
      <button class="pill" data-win="chat" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Chat</button>
      <button class="pill" data-win="boards" type="button"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Tareas</button>
    </div>
  </div>

  <div class="col">
    <section class="card grow">
      <div class="eyebrow">Agenda de hoy <span class="act" data-ask="Léeme la agenda de hoy.">Escuchar</span></div>
      <div class="timeline" id="timeline"><div class="empty">Sin citas</div></div>
    </section>
    <section class="card alerts">
      <div class="eyebrow">Avisos</div>
      <div id="alerts"><div class="empty">Todo en orden</div></div>
    </section>
    <div class="sys" id="sys"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="fveil" id="fveil"><div class="fpanel" id="fpanel" role="dialog" aria-modal="true" aria-label="Mis archivos">
  <header><h2>Mis archivos</h2>
    <button class="pill" id="f-up" type="button"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Subir archivos</button>
    <button class="pill" id="f-openfolder" type="button"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Abrir carpeta</button>
    <button class="x" id="f-close" type="button" aria-label="Cerrar">✕</button></header>
  <div class="fbody"><div class="fgrid" id="f-grid"></div></div>
  <div class="drop">Suelte aquí para subir a Lumi</div>
  <input type="file" id="f-pick" multiple hidden>
</div></div>
<div class="veil" id="veil"><div class="panel frame"><iframe id="p-frame" title="Salón" src="about:blank"></iframe></div></div>
<script>
(() => {
  const BASE = "http://127.0.0.1:5055";
  const TOKEN = "__HUD_TOKEN__";
  const AUTH = { "X-Lumi-Token": TOKEN };
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const STATES = { LISTENING: "Te escucho", STANDBY: "Di «Lumi» para hablar", THINKING: "Pensando…", SPEAKING: "Hablando",
                   MUTED: "Micro silenciado", OFFLINE: "Lumi se está iniciando…", DICTATING: "Dictando" };
  function toast(m) { const el = $("toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200); }
  async function api(path, opts = {}) {
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), opts.timeout || 8000);
    try {
      const r = await fetch(BASE + path, { method: opts.method || "GET", headers: { ...AUTH, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
                                           body: opts.body ? JSON.stringify(opts.body) : undefined, signal: ctrl.signal, cache: "no-store" });
      return await r.json();
    } finally { clearTimeout(tm); }
  }

  // ───────── background: silk strands ─────────
  const cv = $("bg"), cx = cv.getContext("2d");
  let W, H, energy = 0;
  function resize() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", resize); resize();
  function drawBg(t) {
    const g = cx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#0d100a"); g.addColorStop(.55, "#151a10"); g.addColorStop(1, "#1b2214");
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    const glow = cx.createRadialGradient(W * .5, H * .45, 0, W * .5, H * .45, Math.max(W, H) * .55);
    glow.addColorStop(0, `rgba(201,192,143,${.10 + energy * .12})`); glow.addColorStop(1, "rgba(201,192,143,0)");
    cx.fillStyle = glow; cx.fillRect(0, 0, W, H);
    cx.lineWidth = 1.1 * devicePixelRatio;
    const n = 26;
    for (let k = 0; k < n; k++) {
      const p = k / n, y0 = H * (.58 + p * .5);
      cx.beginPath();
      for (let x = 0; x <= W; x += 18 * devicePixelRatio) {
        const u = x / W;
        const y = y0 - H * .34 * Math.sin(u * Math.PI) + Math.sin(u * 5 + t / 2600 + k * .33) * H * (.035 + energy * .03)
                  + Math.sin(u * 13 - t / 1700 + k) * H * .006;
        x === 0 ? cx.moveTo(x, y) : cx.lineTo(x, y);
      }
      const a = .05 + .10 * Math.sin(p * Math.PI);
      cx.strokeStyle = k % 3 ? `rgba(201,192,143,${a})` : `rgba(200,167,90,${a * 1.2})`;
      cx.stroke();
    }
  }

  // ───────── orb ─────────
  const oc = $("orbc"), ox = oc.getContext("2d");
  function drawOrb(t) {
    const s = oc.clientWidth * devicePixelRatio; if (oc.width !== s) { oc.width = oc.height = s; }
    const c = s / 2; ox.clearRect(0, 0, s, s);
    const st = live.state;
    const lvl = Math.min(1, Math.max(live.level_out || 0, (live.level_in || 0) * .7) * 3.2);
    energy += (lvl - energy) * .12;
    const halo = ox.createRadialGradient(c, c, s * .18, c, c, s * .5);
    halo.addColorStop(0, `rgba(201,192,143,${.28 + energy * .3})`); halo.addColorStop(1, "rgba(201,192,143,0)");
    ox.fillStyle = halo; ox.beginPath(); ox.arc(c, c, s * .5, 0, 6.283); ox.fill();
    const pearl = ox.createRadialGradient(c - s * .08, c - s * .1, s * .02, c, c, s * .3);
    pearl.addColorStop(0, "#f4f3e6"); pearl.addColorStop(.35, "#a9ae7c"); pearl.addColorStop(1, "#2f3a22");
    ox.fillStyle = pearl; ox.beginPath(); ox.arc(c, c, s * .27, 0, 6.283); ox.fill();
    // orbiting strands
    const col = st === "MUTED" ? "255,138,138" : st === "THINKING" ? "200,167,90" : "238,240,226";
    for (let k = 0; k < 7; k++) {
      ox.beginPath();
      for (let i = 0; i <= 120; i++) {
        const a = i / 120 * 6.283;
        const r = s * (.33 + k * .018) + Math.sin(a * (3 + k % 3) + t / (700 + k * 90) + k) * s * (.012 + energy * .05);
        const x = c + Math.cos(a + t / (9000 - k * 700)) * r, y = c + Math.sin(a + t / (9000 - k * 700)) * r;
        i ? ox.lineTo(x, y) : ox.moveTo(x, y);
      }
      ox.strokeStyle = `rgba(${col},${.18 + .06 * (k % 3)})`; ox.lineWidth = devicePixelRatio; ox.stroke();
    }
  }
  function frame(t) { drawBg(t); drawOrb(t); requestAnimationFrame(frame); }

  // ───────── state ─────────
  let live = { state: "OFFLINE", log: [] }, lastKey = "", owner = "";
  async function poll() {
    try { live = await (await fetch(BASE + "/state", { cache: "no-store" })).json(); owner = live.owner || ""; }
    catch { live = { state: "OFFLINE", log: [] }; }
    $("state").textContent = live.state; $("hint").textContent = STATES[live.state] || "";
    $("mic").classList.toggle("muted", live.state === "MUTED" || !!live.muted);
    const last = [...(live.log || [])].reverse().find(e => e.who === "ai" || e.who === "user");
    const key = last ? last.t + last.text : "";
    if (key !== lastKey) { lastKey = key; $("bubble").innerHTML = last ? `<small>${last.who === "ai" ? "Lumi" : esc(owner || "Tú")}</small>${esc(last.text)}` : ""; }
    if (live.sys && live.sys.cpu != null) $("sys").textContent = `CPU ${Math.round(live.sys.cpu)}% · RAM ${Math.round(live.sys.ram)}%`;
  }
  setInterval(poll, 160); poll();

  // ───────── clock ─────────
  function tick() {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit", hour12: false });
    const ds = d.toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" });
    $("date").textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
  }
  setInterval(tick, 1000); tick();

  async function loadWeather() {
    try { const w = await api("/weather", { timeout: 15000 }); if (w.ok) $("wx").textContent = `${w.icon} ${Math.round(w.temp)}° · ${w.text} · ${w.location}`; } catch {}
  }
  setInterval(loadWeather, 600000); setTimeout(loadWeather, 1500);

  // ───────── salon ─────────
  const money = v => (v || 0).toLocaleString("en-GB", { style: "currency", currency: "GBP", minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: v % 1 ? 2 : 0 });
  async function loadSalon() {
    let d; try { d = await api("/salon_today"); } catch { return; }
    if (!d || !d.ok) return;
    if (d.salon) $("salon").textContent = d.salon;
    const now = new Date().toISOString().slice(0, 16);
    const nowLocal = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    const apps = d.appointments || [];
    $("k-apps").textContent = apps.length;
    $("k-left").textContent = apps.filter(a => a.status !== "done" && a.start.slice(0, 16) >= nowLocal).length;
    $("k-cash").textContent = money(d.takings);
    if (d.next) {
      const n = d.next;
      $("next").innerHTML = `<div class="when">${n.start.slice(11, 16)}</div><div class="who">${esc(n.client || "")}</div>
        <div class="what">${esc(n.service || "")}${n.staff ? " · " + esc(n.staff) : ""}</div>
        ${n.allergies ? `<div class="warn">⚠ Alergias: ${esc(n.allergies)}</div>` : ""}`;
    } else $("next").innerHTML = `<div class="empty">${apps.length ? "No quedan más citas hoy" : "Hoy no hay citas"}</div>`;
    $("timeline").innerHTML = apps.length ? apps.map(a => {
      const cur = a.start.slice(0, 16) <= nowLocal && a.end.slice(0, 16) > nowLocal && a.status !== "done";
      return `<div class="slot ${a.status === "done" ? "done" : ""} ${cur ? "now" : ""}"><div class="t">${a.start.slice(11, 16)}</div>
        <div class="b" style="border-left-color:${esc(a.staff_color || "#c9c08f")}"><div class="c">${esc(a.client || "—")}</div>
        <div class="s">${esc(a.service || "")}${a.staff ? " · " + esc(a.staff) : ""}${a.allergies ? ' · <span class="al">⚠ alergia</span>' : ""}</div></div></div>`;
    }).join("") : `<div class="empty">${d.open ? `Abierto de ${d.open} a ${d.close}. Sin citas todavía.` : "Hoy el salón está cerrado."}</div>`;
    const rows = [];
    (d.birthdays || []).forEach(b => rows.push(`<div class="row bd"><b>Cumple</b>${esc(b)}</div>`));
    (d.low_stock || []).forEach(p => rows.push(`<div class="row"><b>Stock</b>${esc(p.name)} · quedan ${p.stock}</div>`));
    $("alerts").innerHTML = rows.length ? rows.join("") : `<div class="empty">Todo en orden</div>`;
  }
  setInterval(loadSalon, 10000); setTimeout(loadSalon, 800);

  // ───────── actions ─────────
  async function post(path, body, timeout = 15000) {
    if (live.state === "OFFLINE") { toast("Lumi todavía no está en marcha"); return { ok: false }; }
    try { return await api(path, { method: "POST", body, timeout }); } catch { return { ok: false }; }
  }
  document.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => { toast("Preguntando a Lumi…"); post("/chat", { text: b.dataset.ask }); });
  document.querySelectorAll("[data-win]").forEach(b => b.onclick = async () => {
    toast("Abriendo…");
    const r = await post(`/window?page=${b.dataset.win}`);
    if (r && r.ok === false && live.state !== "OFFLINE") toast("No se pudo abrir la ventana");
  });

  // ───────── Huecos / Caja / Stock: the salon screen (agenda, caja, stock, all editable) ─────────
  // Mac: inside the desktop (it can type there). Windows/Lively: its own window, because Lively
  // only passes the mouse to the wallpaper and the forms need the keyboard.
  const TABS = { slots: "agenda", cash: "cash", stock: "stock", recipes: "recipes" };
  const IS_MAC = /Mac/.test(navigator.platform || navigator.userAgent);
  function openPanel(kind, item) {
    const tab = TABS[kind] || "agenda";
    if (live.state === "OFFLINE") { toast("Lumi todavía no está en marcha"); return; }
    if (IS_MAC) {
      $("p-frame").src = `${BASE}/ui/salon?embed=1&tab=${tab}${item ? "&item=" + encodeURIComponent(item) : ""}&r=${Date.now()}`;
      $("veil").classList.add("show");
    } else {
      toast("Abriendo…");
      post(`/window?page=salon&tab=${tab}`);
    }
  }
  function closePanel() { $("veil").classList.remove("show"); $("p-frame").src = "about:blank"; loadSalon(); }
  document.querySelectorAll("[data-panel]").forEach(b => b.onclick = () => openPanel(b.dataset.panel));
  // Lumi asked to show something (e.g. «enséñame la receta de…»): on Mac open it here on the desktop
  let panelReqTs = null;
  setInterval(() => {
    const r = live && live.panel_req;
    if (!r || r.ts === panelReqTs) return;
    const first = panelReqTs === null; panelReqTs = r.ts;
    if (first && Date.now() / 1000 - r.ts > 20) return;          // old request from before this page loaded
    if (IS_MAC) openPanel(r.tab === "recipes" ? "recipes" : r.tab, r.item);
  }, 1000);
  $("veil").onclick = e => { if (e.target.id === "veil") closePanel(); };
  window.addEventListener("message", e => { if (e.data === "lumi-close") closePanel(); else if (e.data === "lumi-refresh") loadSalon(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
  const mute = async () => { try { await fetch(BASE + "/mute", { method: "POST" }); } catch {} };
  $("mic").onclick = mute; $("orb").onclick = mute;


  // ───────── Mis archivos (folder) ─────────
  const ICONS = {
    pdf: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
    sheet: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/>',
    video: '<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/>',
    audio: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  };
  const size = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
  let files = [];
  async function loadFiles() {
    let d; try { d = await api("/files"); } catch { return; }
    if (!d || !d.ok) return;
    files = d.items;
    $("f-title").textContent = files.length ? `${files.length} archivo${files.length === 1 ? "" : "s"}` : "Carpeta vacía";
    $("f-count").textContent = files.length ? `Último: ${files[0].name}` : "Arrastre aquí fotos, PDF o documentos";
    const shown = files.slice(0, 5);
    $("f-recent").innerHTML = shown.map(f => `<div class="tb" title="${esc(f.name)}">${f.kind === "image"
        ? `<img loading="lazy" alt="" src="${BASE}/file?name=${encodeURIComponent(f.name)}&t=${TOKEN}">`
        : `<svg viewBox="0 0 24 24">${ICONS[f.kind] || ICONS.file}</svg>`}</div>`).join("")
      + (files.length > 5 ? `<div class="tb more">+${files.length - 5}</div>` : "");
    if ($("fveil").classList.contains("show")) renderFiles();
  }
  function renderFiles() {
    const g = $("f-grid");
    if (!files.length) { g.innerHTML = `<div class="fempty" style="grid-column:1/-1">La carpeta está vacía.<br>Pulse «Subir archivos» o arrastre aquí fotos, PDF o documentos.</div>`; return; }
    g.innerHTML = files.map((f, i) => `<div class="tile" data-i="${i}">
      <div class="th">${f.kind === "image" ? `<img loading="lazy" alt="" src="${BASE}/file?name=${encodeURIComponent(f.name)}&t=${TOKEN}">`
        : `<svg viewBox="0 0 24 24">${ICONS[f.kind] || ICONS.file}</svg><span class="ext">${esc((f.name.split(".").pop() || "").toUpperCase().slice(0, 5))}</span>`}</div>
      <div class="nm" title="${esc(f.name)}">${esc(f.name)}</div><div class="mt">${f.mtime} · ${size(f.size)}</div>
      <div class="ta"><button data-a="open" type="button">Abrir</button><button data-a="use" type="button">A Lumi</button><button data-a="delete" type="button">Quitar</button></div></div>`).join("");
    g.querySelectorAll(".tile").forEach(tile => tile.querySelectorAll("button").forEach(b => b.onclick = async () => {
      const f = files[+tile.dataset.i];
      if (b.dataset.a === "delete" && !b.classList.contains("arm")) {
        b.classList.add("arm"); b.textContent = "¿Seguro?"; setTimeout(() => { b.classList.remove("arm"); b.textContent = "Quitar"; }, 3000); return;
      }
      const r = await post("/files_action", { action: b.dataset.a, name: f.name });
      if (r && r.msg) toast(r.msg);
      if (b.dataset.a === "delete") loadFiles();
      if (b.dataset.a === "use" && r && r.ok) closeFiles();
    }));
  }
  async function upload(list) {
    const arr = [...list].filter(f => f.size <= 100 * 1024 * 1024);
    if (!arr.length) return;
    let ok = 0;
    for (const f of arr) {
      toast(`Subiendo ${f.name}…`);
      try {
        const r = await fetch(`${BASE}/upload?name=${encodeURIComponent(f.name)}`, { method: "POST", headers: AUTH, body: f });
        if ((await r.json()).ok) ok++;
      } catch {}
    }
    toast(ok === arr.length ? `${ok} archivo(s) subido(s)` : `Subidos ${ok} de ${arr.length}`);
    loadFiles();
  }
  function openFiles() { $("fveil").classList.add("show"); renderFiles(); loadFiles(); }
  function closeFiles() { $("fveil").classList.remove("show"); }
  $("folder").onclick = openFiles;
  $("f-quick").onclick = e => { e.stopPropagation(); $("f-pick").click(); };
  $("folder").onkeydown = e => { if (e.key === "Enter" || e.key === " ") openFiles(); };
  $("f-close").onclick = closeFiles;
  $("fveil").onclick = e => { if (e.target.id === "fveil") closeFiles(); };
  $("f-up").onclick = () => $("f-pick").click();
  $("f-pick").onchange = e => { upload(e.target.files); e.target.value = ""; };
  $("f-openfolder").onclick = () => post("/files_action", { action: "open_folder" }).then(r => r && r.msg && toast(r.msg));
  // drag & drop onto the folder card or the open panel
  for (const [el, cls] of [[$("folder"), "over"], [$("fpanel"), "over"]]) {
    el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add(cls); });
    el.addEventListener("dragleave", e => { if (!el.contains(e.relatedTarget)) el.classList.remove(cls); });
    el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove(cls); if (e.dataTransfer.files.length) { upload(e.dataTransfer.files); if (el.id === "folder") openFiles(); } });
  }
  window.addEventListener("dragover", e => e.preventDefault());       // never navigate away when a file is dropped
  window.addEventListener("drop", e => e.preventDefault());
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeFiles(); });
  setInterval(loadFiles, 20000); setTimeout(loadFiles, 1200);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
